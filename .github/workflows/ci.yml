name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint & format check
        run: bun run check

      - name: Type check
        run: bunx --bun tsc --noEmit

      - name: Run tests with coverage
        run: bun test --coverage 2>&1 | tee /tmp/test-output.txt

      - name: Check coverage threshold
        run: |
          # Extract overall line coverage percentage
          LINE_COV=$(grep "All files" /tmp/test-output.txt | awk -F'|' '{gsub(/[[:space:]]/, "", $3); print $3}')
          FUNC_COV=$(grep "All files" /tmp/test-output.txt | awk -F'|' '{gsub(/[[:space:]]/, "", $2); print $2}')
          echo "Line coverage: ${LINE_COV}%"
          echo "Function coverage: ${FUNC_COV}%"

          # Fail if line coverage drops below 80%
          if [ "$(echo "$LINE_COV < 80" | bc)" -eq 1 ]; then
            echo "::error::Line coverage ${LINE_COV}% is below 80% threshold"
            exit 1
          fi
          echo "Coverage check passed."

          # Generate shields.io endpoint badge JSON for dynamic coverage badge
          COV_INT=${LINE_COV%.*}
          if [ "$COV_INT" -ge 90 ]; then COLOR="brightgreen";
          elif [ "$COV_INT" -ge 80 ]; then COLOR="green";
          elif [ "$COV_INT" -ge 70 ]; then COLOR="yellowgreen";
          elif [ "$COV_INT" -ge 60 ]; then COLOR="yellow";
          else COLOR="red"; fi
          echo "{\"schemaVersion\":1,\"label\":\"coverage\",\"message\":\"${LINE_COV}%\",\"color\":\"${COLOR}\"}" > /tmp/coverage.json

      - name: Upload coverage badge data
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-badge
          path: /tmp/coverage.json

  docs:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: test
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build docs
        run: bun run docs:build

      - name: Download coverage badge
        uses: actions/download-artifact@v8
        with:
          name: coverage-badge
          path: docs/.vitepress/dist

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  quickstart:
    name: Quick Start smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (README Quick Start step 1)
        run: bun install

      - name: Link CLI on PATH (README Quick Start step 2)
        run: bun link

      - name: Verify cronbase is on PATH and prints a version
        run: |
          which cronbase
          VERSION=$(cronbase --version)
          echo "Got: $VERSION"
          # Expect "cronbase v<semver>" matching package.json
          PKG_VERSION=$(node -p "require('./package.json').version")
          case "$VERSION" in
            *"v${PKG_VERSION}"*) echo "Version string matches package.json (${PKG_VERSION})" ;;
            *) echo "::error::cronbase --version output '$VERSION' does not contain package.json version v${PKG_VERSION}"; exit 1 ;;
          esac

      - name: Verify --help works
        run: cronbase --help

      - name: Run cronbase doctor
        run: cronbase doctor

      - name: Validate every example config
        run: |
          for f in examples/*.yaml; do
            echo "--- validating $f ---"
            cronbase validate --path "$f"
          done

      - name: CLI round-trip — add, list, show, remove
        run: |
          export CRONBASE_DB="$RUNNER_TEMP/smoke.db"
          cronbase add --name smoke-test --schedule "*/5 * * * *" --command "echo hi"
          cronbase list
          cronbase show smoke-test
          cronbase remove smoke-test
          echo "CLI round-trip OK"

      - name: Start server in background and probe endpoints
        run: |
          export CRONBASE_DB="$RUNNER_TEMP/server-smoke.db"
          cronbase start --port 7433 &
          SERVER_PID=$!
          echo "Started server (pid $SERVER_PID), waiting for readiness..."
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:7433/health >/dev/null; then
              echo "Server ready after ${i}s"
              break
            fi
            sleep 1
          done
          echo "--- GET /health ---"
          curl -sf http://127.0.0.1:7433/health
          echo
          echo "--- GET /metrics (first 20 lines) ---"
          curl -sf http://127.0.0.1:7433/metrics | head -20
          echo "--- GET /api/jobs ---"
          curl -sf http://127.0.0.1:7433/api/jobs
          echo
          kill "$SERVER_PID"
          wait "$SERVER_PID" 2>/dev/null || true
          echo "Server stopped cleanly"
